name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: pip-audit (HIGH/CRITICAL only — Phase 2.9)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict --vulnerability-service=osv

      # Docker is available on ubuntu-latest by default; testcontainers will
      # auto-pull postgres:16-alpine for the DB-mode tests in tests/test_db_mode.py.
      # Asserting it explicitly so a future runner image change can't silently
      # downgrade us to seed-mode-only coverage.
      - name: Verify Docker daemon for testcontainers
        run: docker ps >/dev/null

      - name: Pytest with coverage (≥ 70% floor; DB-mode tests included)
        run: pytest --cov=app --cov-branch --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (prettier + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm install` instead of `npm ci` tolerates cross-platform lockfile
        # drift on optional native deps (the @emnapi/* wasm shims have
        # different version-resolution paths on Windows vs Linux). We commit
        # a known-good lockfile generated locally; CI rebases the missing
        # Linux-only optional entries on top.
        run: npm install --no-audit --no-fund

      - name: npm audit (HIGH/CRITICAL only — Phase 2.9)
        run: npm audit --omit=dev --audit-level=high

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Next 16 generates `.next/types/routes.d.ts` during build and
      # next-env.d.ts now imports it — so `tsc --noEmit` must run AFTER build
      # or the cold-CI typecheck fails on the missing file.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest with coverage gate
        run: npm run test:coverage

  e2e:
    name: E2E (Playwright + axe-core)
    runs-on: ubuntu-latest
    # Run after the unit gates have a chance to surface cheaper failures.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100/api/v1

      - name: Playwright (auth-flow + a11y, seed mode)
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (perf + a11y budget)
    runs-on: ubuntu-latest
    needs: [frontend]
    # Don't gate PRs on transient perf noise — the budget assertions still run,
    # we just don't want a 99→89 flake to block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100/api/v1

      - name: Start frontend
        working-directory: frontend
        run: npx next start -p 3100 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then
              echo "Frontend up"; exit 0
            fi
            sleep 1
          done
          echo "Frontend never came up"; exit 1

      - name: Lighthouse CI
        working-directory: frontend
        run: npx lhci autorun
