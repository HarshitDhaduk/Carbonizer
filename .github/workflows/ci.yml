name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: pip-audit (HIGH/CRITICAL only — Phase 2.9)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict --vulnerability-service=osv

      - name: Pytest with coverage (≥ 65% floor)
        run: pytest --cov=app --cov-branch --cov-report=xml --cov-fail-under=65

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (prettier + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm install` instead of `npm ci` tolerates cross-platform lockfile
        # drift on optional native deps (the @emnapi/* wasm shims have
        # different version-resolution paths on Windows vs Linux). We commit
        # a known-good lockfile generated locally; CI rebases the missing
        # Linux-only optional entries on top.
        run: npm install --no-audit --no-fund

      - name: npm audit (HIGH/CRITICAL only — Phase 2.9)
        run: npm audit --omit=dev --audit-level=high

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Next 16 generates `.next/types/routes.d.ts` during build and
      # next-env.d.ts now imports it — so `tsc --noEmit` must run AFTER build
      # or the cold-CI typecheck fails on the missing file.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest (Phase 3.1 — unit + component)
        run: npm test
