name: Dependency audit (weekly)

# Phase 2.9 follow-up — the per-PR audit (in ci.yml) gates on HIGH/CRITICAL
# only, so the merge is fast. This weekly job catches MEDIUM and LOW vulns
# so they're not deferred indefinitely. Surfaces as a tracked workflow run;
# doesn't auto-PR or auto-merge.

on:
  schedule:
    # 03:00 UTC every Monday — same morning as the mutmut run so anyone
    # checking weekly health sees both signals together.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: pip-audit (all severities)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit (informational — never fails the workflow)
        # `|| true` because the weekly job's purpose is visibility, not
        # blocking. The per-PR job in ci.yml is the gate.
        run: |
          pip-audit --requirement requirements.txt --vulnerability-service=osv \
            --format=columns || true

  frontend-audit:
    name: npm audit (all severities)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Audit (informational — never fails the workflow)
        run: npm audit || true
