version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      # SQLAlchemy + alembic + asyncpg move together
      sqlalchemy-stack:
        patterns: ["sqlalchemy*", "alembic", "asyncpg"]
      # FastAPI + uvicorn + python-multipart move together
      fastapi-stack:
        patterns: ["fastapi", "uvicorn*", "python-multipart"]
      # Pydantic core + settings move together
      pydantic-stack:
        patterns: ["pydantic*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    # Major bumps for framework-level packages require a planned migration
    # (e.g. drei@10 needs React 19). Let Dependabot ship safe minor/patch
    # updates only; we'll schedule the majors ourselves.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/fiber"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/drei"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      # @react-three/fiber and @react-three/drei have linked peer-dep
      # versions — they must be bumped together or both stay put.
      react-three:
        patterns: ["@react-three/*", "three", "@types/three", "three-mesh-bvh"]
      # Next.js + eslint-config-next move as a unit.
      nextjs:
        patterns: ["next", "eslint-config-next"]
      # React types + react itself.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Tailwind + plugins + autoprefixer + postcss.
      tailwind:
        patterns: ["tailwindcss*", "@tailwindcss/*", "autoprefixer", "postcss"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
