[project]
name = "carbonizer-backend"
version = "0.1.0"
description = "Carbonizer — personal carbon tracking API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "PyJWT==2.13.0",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.31",
    "slowapi==0.1.9",
    "cryptography==50.0.0",
    "prometheus-client==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.15.18",
    "mypy==2.1.0",
    "types-passlib",
    "hypothesis==6.119.0",
    "testcontainers[postgres]==4.9.0",
    "psycopg[binary]==3.2.3",
    "mutmut==3.6.0",
    "interrogate==1.7.0",
]

# Phase 3.4 — mutation testing. Run on a weekly schedule (see
# .github/workflows/mutmut.yml). Targets the pure-math services where
# we already have unit + property coverage; mutation testing measures
# how often a flipped operator or a swapped constant survives.
[tool.mutmut]
paths_to_mutate = [
    "app/services/carbon.py",
    "app/services/estimator.py",
    "app/services/impute.py",
    "app/services/benchmark_stats.py",
    "app/services/attribution.py",
]
runner = "python -m pytest -x -q tests/test_api.py tests/test_estimator_properties.py"
# Skip integration tests; mutation testing only on the pure-math path.
tests_dir = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/seed_db.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "ASYNC", # async correctness
    "RUF",   # ruff-specific
    "C901",  # cyclomatic complexity — Phase 6.4 acceptance (< 10 per function)
]
ignore = [
    "E501",  # line too long (sometimes unavoidable in URLs / docstrings)
    "B008",  # function call in default arg — FastAPI Depends() pattern
    "SIM117", # nested with — sometimes clearer
    "RUF002", # em-dashes in docstrings are intentional throughout
    "UP042",  # str-enum migration deferred — risks subtle behavior changes
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# Docstring-coverage gate. The public surface (api/ + services/ + schemas/ +
# models/) is at 100% today; this floor lets us add private helpers without
# triggering a doc-debt rabbit-hole. Private helpers, tests, and one-off
# migrations are excluded so the metric tracks *user-visible code* only.
[tool.interrogate]
fail-under = 75
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-setters = true
exclude = ["alembic", "tests", ".venv"]
verbose = 1
omit-covered-files = true
quiet = false

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Phase 6.4 acceptance — `--strict` is the gate. Equivalent flags expanded
# inline so we can selectively relax one without flipping `strict` back off.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["alembic/versions", "\\.venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
